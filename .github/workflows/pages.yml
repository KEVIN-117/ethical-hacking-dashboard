name: Build and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4

      - name: Checkout Quartz generator
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: 97a2d05f80c4c50534959b1d0d41cc4b3895625e
          path: quartz

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dashboard dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Quartz dependencies
        run: npm ci --prefix quartz

      - name: Build static site
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /ethical-hacking-dashboard
          QUARTZ_DIR: ${{ github.workspace }}/quartz

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
